[package]
name = "nook-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri-free openNook backend: media, calendar, files, widgets, notch"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
dirs.workspace = true
rusqlite.workspace = true
base64.workspace = true
log.workspace = true
chrono.workspace = true
reqwest.workspace = true
futures-util.workspace = true
open.workspace = true
sysinfo = "0.37"
notify = "7"
plist = "1"
walkdir = "2"
notify = "7"
notify-debouncer-mini = "0.5"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
libc = "0.2"
objc2-foundation = { version = "0.3", features = [
    "NSRegularExpression",
    "NSTextCheckingResult",
] }
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKReminder", "EKCalendar"] }
objc2-core-audio = { version = "0.3.2", features = ["AudioHardware", "objc2", "objc2-foundation", "block2"] }
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = ["CFDictionary", "CFString"] }
objc2-core-location = { version = "0.3", features = ["CLLocationManager", "CLLocation"] }
block2 = "0.6"
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Media_Control",
    "Storage_Streams",
    "Foundation",
] }
winreg = "0.55"
futures-executor = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4.0"
