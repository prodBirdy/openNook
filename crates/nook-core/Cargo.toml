[package]
name = "nook-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri-free openNook backend: media, calendar, files, widgets, notch"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
dirs.workspace = true
rusqlite.workspace = true
base64.workspace = true
log.workspace = true
reqwest.workspace = true
futures-util.workspace = true
open.workspace = true
sysinfo = "0.37"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKReminder", "EKCalendar"] }
objc2-core-location = { version = "0.3", features = ["CLLocationManager", "CLLocation"] }
block2 = "0.6"
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Media_Control",
    "Storage_Streams",
    "Foundation",
] }
winreg = "0.55"
futures-executor = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4.0"
