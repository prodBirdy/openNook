<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>openNook</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f3f3;
      color: #111;
    }
    main { width: min(40rem, calc(100% - 3rem)); }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.35rem; }
    .lede { margin: 0 0 1.5rem; color: #444; }
    .win {
      display: inline-block;
      background: #111;
      color: #fff;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 500;
    }
    .legacy { margin: 0.85rem 0 0; font-size: 0.8rem; color: #555; }
    .legacy a { color: inherit; }
    .shots { margin: 1.5rem 0 0; }
    .shots figure { margin: 0; }
    .shots img { display: block; width: 100%; height: auto; border-radius: 0.5rem; }
    .shots figcaption { margin: 0.35rem 0 0; font-size: 0.75rem; color: #555; }
    .shots .lead { margin: 0 0 0.75rem; }
    .shots .more { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    nav { margin-top: 1.25rem; font-size: 0.9rem; color: #555; }
    nav a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>openNook</h1>
    <p class="lede">Native macOS and Linux Dynamic Island client</p>
    <p>
      <a class="win" href="https://github.com/prodBirdy/openNook/releases/download/v1.0.0/openNook-1.0.0.dmg">Download for Mac</a>
    </p>
    <p class="legacy">
      <a href="https://github.com/prodBirdy/openNook/releases/download/v1.0.0-linux/openNook-1.0.0-x86_64-unknown-linux-gnu.tar.gz">Linux 1.0.0 (GPUI tarball)</a>
    </p>
    <div class="shots">
      <figure class="lead">
        <img src="linux-03-compact.png" alt="Linux GPUI compact island at top center">
        <figcaption>Linux GPUI · compact</figcaption>
      </figure>
      <div class="more">
        <figure>
          <img src="linux-03-expanded.png" alt="Linux GPUI expanded Nook tab">
          <figcaption>Linux GPUI · expanded</figcaption>
        </figure>
        <figure>
          <img src="linux-03-settings.png" alt="Linux GPUI Settings Widgets">
          <figcaption>Linux GPUI · settings</figcaption>
        </figure>
        <figure>
          <img src="linux-03-file-tray.png" alt="Linux GPUI Tray tab">
          <figcaption>Linux GPUI · tray</figcaption>
        </figure>
      </div>
    </div>
    <nav>
      <a href="https://github.com/prodBirdy/openNook">Source</a>
      ·
      <a href="https://github.com/prodBirdy/openNook/releases">Releases</a>
    </nav>
  </main>
</body>
</html>
