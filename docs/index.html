<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>openNook</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f3f3;
      color: #111;
    }
    main { width: min(40rem, calc(100% - 3rem)); }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.35rem; }
    .lede { margin: 0 0 1.5rem; color: #444; }
    .win {
      display: inline-block;
      background: #111;
      color: #fff;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 500;
    }
    .legacy { margin: 0.85rem 0 0; font-size: 0.8rem; color: #555; }
    .legacy a { color: inherit; }
    .shots { margin: 1.5rem 0 0; }
    .shots figure { margin: 0; }
    .shots img { display: block; width: 100%; height: auto; border-radius: 0.5rem; }
    .shots figcaption { margin: 0.35rem 0 0; font-size: 0.75rem; color: #555; }
    .shots .lead { margin: 0 0 0.75rem; }
    .shots .more { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    nav { margin-top: 1.25rem; font-size: 0.9rem; color: #555; }
    nav a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>openNook</h1>
    <p class="lede">A Dynamic Island for the MacBook notch where everything it shows is a mod: a few lines of JavaScript you or your coding agent write while it runs.</p>
    <p>
      <a class="win" href="https://github.com/prodBirdy/openNook/releases/download/v2.0.0-alpha.1/openNook-2.0.0-alpha.1.dmg">Download for Mac</a>
    </p>
    <p class="legacy">2.0 alpha · macOS 14+ · <a href="https://github.com/prodBirdy/openNook/releases">older releases</a></p>
    <div class="shots">
      <figure class="lead">
        <img src="screens/world-clock.png" alt="The open island showing the World Clock mod: a dot-matrix world lit where the sun is up, with city times">
        <figcaption>World Clock</figcaption>
      </figure>
      <div class="more">
        <figure>
          <img src="screens/weather.png" alt="The Weather mod over an animated night sky with the moon">
          <figcaption>Weather</figcaption>
        </figure>
        <figure>
          <img src="screens/iss.png" alt="The ISS mod: the station's position over a world map, altitude and speed">
          <figcaption>ISS</figcaption>
        </figure>
        <figure>
          <img src="screens/timer.png" alt="The Timer mod with presets and a countdown ring">
          <figcaption>Timer</figcaption>
        </figure>
        <figure>
          <img src="screens/herdr.png" alt="The Herdr mod listing coding agents and their status">
          <figcaption>Herdr agents</figcaption>
        </figure>
        <figure>
          <img src="screens/closed.png" alt="The closed island around the camera, showing three agents working">
          <figcaption>Closed</figcaption>
        </figure>
        <figure>
          <img src="screens/hover.png" alt="The closed island hovered, peeking out with a detail line">
          <figcaption>Hover peek</figcaption>
        </figure>
      </div>
    </div>
    <nav>
      <a href="https://github.com/prodBirdy/openNook">Source</a>
      ·
      <a href="https://github.com/prodBirdy/openNook/releases">Releases</a>
    </nav>
  </main>
</body>
</html>
