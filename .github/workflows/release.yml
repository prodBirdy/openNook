# Retired Tauri ship path.
#
# After GPUI 1.0.0 landed on main (#79 / 2252e6b), this file was still the old
# Tauri pipeline: Setup Bun, `bun install`, tauri-apps/tauri-action.
# The workspace is now Cargo.toml + crates/nook. There is no root package.json
# and no src-tauri, so Release #6 failed in ~34s on windows-latest and
# ubuntu-22.04 with "Bun could not find a package.json file to install from":
# https://github.com/prodBirdy/openNook/actions/runs/34784616855
#
# A real GPUI 1.0 desktop installer is not published from this file. Do not
# re-enable bun/tauri-action or attach fake AppImage/exe assets.
#
# Existing honest GPUI Linux ship path:
#   .github/workflows/linux-release.yml  (tag v*-linux, cargo build --release -p nook)
#
# No push/tag triggers, so this cannot fail main. Manual dispatch is a no-op
# that points at linux-release.yml.
name: Release

on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Tauri Release path is retired
        run: |
          echo "The Tauri Release workflow is retired."
          echo "main is GPUI 1.0.0 (Cargo workspace, crates/nook); there is no package.json or src-tauri."
          echo "Use .github/workflows/linux-release.yml (tag v*-linux) for GPUI Linux binaries."
          echo "Do not publish fake AppImage/exe assets from this job."
